<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jastin Cipris</title>
</head>
<body>
    <h1>Table</h1>
    <table border="1">
        <tr>
            <th>Number</th>
            <th>Items</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Apple</td>
            <td rowspan="4">5</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Mango</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Orange</td>
        </tr>
        <tr></tr>
            <td colspan="2">Total</td>
            <td>5</td>
        </tr>
    </table>
    <h1>Inline Elements</h1>
    <p>This is how <span style="border: 1px solid black">span </span>works</p>
    <p> The following spans will be inline; <span style="border: 1px solid black">Span 1</span> and <span style="border: 1px solid black">Span 2</span>.</p>
    <p>Formatting tags like b, strong, em are also inline elements.</p>
</body>
</html>
