<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label for="Firstname">First Name</label>
      <input
        type="text"
        name="firstname"
        id="firstname"
        placeholder="Jastin Papoi"
      />
      <br /><br />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}" />
      <br /><br />

      <label for="colors">Colors</label>
      <select id="colors">
        <option value="pink">Pink</option>
        <option value="peach">Peach</option>
        <option value="periwinkle">Periwinkle</option>
        <option value="purple">Purple</option>
      </select>
      <br /><br />

      <label for="pk-choice">Choose a Pokemon:</label>
      <input list="pk-opts" id="pk-choice" name="pk-choice" />
      <datalist id="pk-opts">
        <option value="Pikachu"></option>
        <option value="Jigglypuff"></option>
        <option value="Squirtle"></option>
        <option value="Psyduck"></option>
        <option value="Jastin"></option>
      </datalist>
      <br /><br />

      <button type="submit" style="margin-right: 20px">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
